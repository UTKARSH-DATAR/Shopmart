services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: shopmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root
      MYSQL_DATABASE: shopmart_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Shopmart Fullstack Application (Angular + Spring Boot)
  shopmart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmart-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/shopmart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql-data:
    driver: local

