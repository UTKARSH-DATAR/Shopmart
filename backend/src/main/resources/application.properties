spring.application.name=backend

# Database Configuration with Environment Variable support:
# If environment variables exist (like on Render or Docker), Spring Boot uses them.
# Otherwise, it falls back to the local defaults after the colon (:).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopmart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (hardcoded)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary credentials from Flopkart reference
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dz8qf9ugu}
cloudinary.api-key=${CLOUDINARY_API_KEY:124898551783626}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:ThGjQhzPISzfDkrXBC23LzZH8CU}
